<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>评测状态 - OIL OJ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar"><div class="title">评测状态</div></div>
    <div class="content">
      <div class="card">
        <div class="card-header">
          评测记录（提交 + Hack）
          <span style="float:right">
            <select id="filter" onchange="load()"
                    style="padding:4px 8px;border:1px solid #d6dee6;border-radius:4px;font-size:13px">
              <option value="all">全部</option>
              <option value="submission">仅提交</option>
              <option value="hack">仅 Hack</option>
            </select>
            <button class="btn btn-sm btn-default" onclick="load()">刷新</button>
          </span>
        </div>
        <table>
          <thead><tr><th>#</th><th>类型</th><th>用户</th><th>题目</th><th>结果</th>
            <th>分数</th><th>时间</th></tr></thead>
          <tbody id="list"></tbody>
        </table>
      </div>

    </div>
  </main>
</div>
<script src="/static/app.js"></script>
<script>
let me=null;

async function load(){
  const f=document.getElementById('filter').value;
  const [subs,hacks]=await Promise.all([
    f==='hack' ? Promise.resolve({submissions:[]}) : API.get('/api/submissions?limit=100'),
    f==='submission' ? Promise.resolve({hacks:[]}) : API.get('/api/hacks?limit=100'),
  ]);

  // Merge both streams into one chronological table.
  const rows=[
    ...subs.submissions.map(s=>({
      sort:s.created_at, kind:'submission', id:s.id,
      who:s.display_name, problem_id:s.problem_id, problem:s.problem_title,
      status:s.status, score:s.score, ts:s.created_at, can_detail:s.can_detail,
    })),
    ...hacks.hacks.map(h=>({
      sort:h.created_at, kind:'hack', id:h.id,
      who:`${h.attacker_name||'?'} → ${h.target_name||'?'}`,
      problem_id:h.problem_id, problem:h.problem_title,
      status:h.status, score:null, ts:h.created_at,
      can_detail:h.can_detail, label:h.kind_label,
    })),
  ].sort((a,b)=>b.sort-a.sort);

  document.getElementById('list').innerHTML = rows.map(r=>{
    const badge = r.kind==='hack' ? hackBadge(r.status) : statusBadge(r.status,r.score);
    const tag = r.kind==='hack'
      ? `<span class="badge badge-HACK">${esc(r.label||'Hack')}</span>`
      : '<span class="muted" style="font-size:12px">提交</span>';
    const link = r.kind==='hack'
      ? `<a href="/hack/${r.id}">H${r.id}</a>`
      : `<a href="/submission/${r.id}">#${r.id}</a>`;
    return `<tr>
      <td class="mono">${link}</td>
      <td>${tag}</td>
      <td>${esc(r.who)}</td>
      <td><a href="/problem/${r.problem_id}">${esc(r.problem||'')}</a></td>
      <td>${badge}</td>
      <td class="mono">${r.score==null?'—':r.score}</td>
      <td class="muted mono" style="font-size:12px;">${fmtTime(r.ts)}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="text-center muted" style="padding:30px;">暂无记录</td></tr>';
}

(async()=>{ me=await loadMe(); renderLayout(me,'status'); load(); setInterval(load,4000); })();
</script></body>
</html>
