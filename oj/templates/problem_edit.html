<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ "编辑题目" if problem else "新建题目" }} - OILOJ</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="nav-brand">OILOJ</a>
      <div class="nav-links">
        <a href="/problems">题库</a>
        <a href="/status">评测</a>
        <a href="/contests">比赛</a>
      </div>
      <div class="nav-user">
        <span class="username">{{ user.username }}</span>
        <a href="/logout" class="btn btn-sm">退出</a>
      </div>
    </div>
  </nav>

  <div class="container main-content">
    <div class="card edit-card">
      <h2>{{ "编辑题目 #" ~ problem.id if problem else "新建题目" }}</h2>
      
      <form action="{{ '/problem/' ~ problem.id ~ '/edit' if problem else '/problem/create' }}" method="post">
        
        <!-- 题目标题 -->
        <div class="form-group">
          <label for="title">题目标题 <span class="required">*</span></label>
          <input type="text" id="title" name="title" class="form-control" 
                 value="{{ problem.title if problem else '' }}" required placeholder="请输入题目名称">
        </div>

        <!-- 出题人字段 -->
        <div class="form-group">
          <label for="author">出题人 (Author)</label>
          {% if user and user.role == 'admin' %}
            <input type="text" id="author" name="author" class="form-control" 
                   value="{{ problem.author if (problem and problem.author) else (user.username if user else '') }}" 
                   placeholder="可指定出题人账号或署名">
            <small class="form-hint">【管理员特权】您可以自由指定或修改此题目的出题人署名。</small>
          {% else %}
            <input type="text" id="author" name="author" class="form-control readonly-input" 
                   value="{{ problem.author if (problem and problem.author) else (user.username if user else '') }}" 
                   readonly>
            <small class="form-hint">出题人默认标注为您的当前账号。</small>
          {% endif %}
        </div>

        <!-- 限制与公开状态设置 -->
        <div class="form-row">
          <div class="form-group col-4">
            <label for="time_limit">时间限制 (ms)</label>
            <input type="number" id="time_limit" name="time_limit" class="form-control" 
                   value="{{ problem.time_limit if problem else 1000 }}" min="100" max="10000" step="100">
          </div>
          <div class="form-group col-4">
            <label for="memory_limit">空间限制 (MB)</label>
            <input type="number" id="memory_limit" name="memory_limit" class="form-control" 
                   value="{{ problem.memory_limit if problem else 256 }}" min="16" max="1024" step="16">
          </div>
          <div class="form-group col-4">
            <label for="is_public">公开状态</label>
            <select id="is_public" name="is_public" class="form-control">
              <option value="0" {{ 'selected' if problem and not problem.is_public else '' }}>隐藏 (未公开)</option>
              <option value="1" {{ 'selected' if problem and problem.is_public else '' }}>公开 (全员可见)</option>
            </select>
          </div>
        </div>

        <!-- 题目正文（支持 Markdown） -->
        <div class="form-group">
          <label for="description">题目描述</label>
          <textarea id="description" name="description" rows="8" class="form-control" 
                    placeholder="支持 Markdown 与 LaTeX 公式...">{{ problem.description if problem else '' }}</textarea>
        </div>

        <div class="form-group">
          <label for="input_format">输入格式</label>
          <textarea id="input_format" name="input_format" rows="4" class="form-control" 
                    placeholder="说明输入的格式...">{{ problem.input_format if problem else '' }}</textarea>
        </div>

        <div class="form-group">
          <label for="output_format">输出格式</label>
          <textarea id="output_format" name="output_format" rows="4" class="form-control" 
                    placeholder="说明输出的格式...">{{ problem.output_format if problem else '' }}</textarea>
        </div>

        <div class="form-group">
          <label for="samples">输入输出样例</label>
          <textarea id="samples" name="samples" rows="6" class="form-control code-font" 
                    placeholder="### 样例输入 1&#10;```&#10;...&#10;```&#10;### 样例输出 1&#10;```&#10;...&#10;```">{{ problem.samples if problem else '' }}</textarea>
        </div>

        <div class="form-group">
          <label for="hint">提示 / 说明</label>
          <textarea id="hint" name="hint" rows="4" class="form-control" 
                    placeholder="数据范围、提示等...">{{ problem.hint if problem else '' }}</textarea>
        </div>

        <!-- 提交与返回 -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-lg">{{ "保存修改" if problem else "立即创建" }}</button>
          <a href="{{ '/problem/' ~ problem.id if problem else '/problems' }}" class="btn btn-outline">取消返回</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
