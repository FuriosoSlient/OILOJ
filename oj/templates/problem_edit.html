<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>题目编辑 - OIL OJ</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div class="title" id="ptitle">题目编辑</div>
      <div style="flex:1"></div>
      <a href="/admin" class="btn btn-sm btn-default">← 返回管理后台</a>
    </div>
    <div class="content">
      <div id="editor"><div class="card"><div class="card-body muted">加载中...</div></div></div>
    </div>
  </main>
</div>
<script src="/static/vendor/marked/marked.min.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/vendor/katex/auto-render.min.js"></script>
<script src="/static/vendor/dompurify/purify.min.js"></script>
<script src="/static/app.js"></script>
<script>
let me=null, editing=null;
const DIFFICULTIES=["入门","普及-","普及","普及+","提高","提高+","省选","NOI-","NOI","NOI+"];

// /admin/problem       -> create
// /admin/problem/{id}  -> edit
const _parts = location.pathname.split('/').filter(Boolean);
const PID = (_parts.length >= 3 && /^\d+$/.test(_parts[2])) ? parseInt(_parts[2]) : null;

async function editProblem(pid){
  let p = {id:null,slug:'',title:'',description:'',background:'',input_format:'',output_format:'',
           samples:'',sample_groups:[],
           constraints:'',time_limit:1000,memory_limit:256,problem_type:'standard',score_total:100,
           difficulty:'',is_public:0,tags:'',position:null,interactive:0,subtasks:[],
           checker_type:'token',spj_source:'',spj_compiled:0,spj_log:'',author:'',std_source:'',
           file_io_in:'',file_io_out:'',use_subtasks:1,hack_validator:'',grader_source:'',interact_header:'',interact_header_name:'interaction.h',attachments:[]};
  if(pid){ const r = await API.get(`/api/admin/problem/${pid}`); p = r.problem; }
  editing = p;
  const diffOpts = ['',...DIFFICULTIES].map(d=>
    `<option value="${esc(d)}" ${p.difficulty===d?'selected':''}>${d||'（未标注）'}</option>`).join('');
  document.getElementById('editor').innerHTML = `
    <div class="card">
      <div class="card-header">${pid?`编辑题目 #${pid}`:'新建题目'}</div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group" style="flex:2"><label>标题</label>
            <input type="text" id="f_title" value="${esc(p.title)}"></div>
          <div class="form-group"><label>Slug（数据目录名）</label>
            <input type="text" id="f_slug" value="${esc(p.slug||'')}">
            <span class="form-hint">数据目录名，与文件 IO 文件名无关</span></div>
          <div class="form-group"><label>类型</label>
            <select id="f_type">
              ${['standard','personal','thinking','mystery'].map(t=>
                `<option value="${t}" ${p.problem_type===t?'selected':''}>${({standard:'普通题',personal:'个人题',thinking:'思维题',mystery:'神秘题'})[t]}</option>`).join('')}
            </select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>难度（比赛期间自动隐藏）</label>
            <select id="f_diff">${diffOpts}</select></div>
          <div class="form-group"><label>满分</label>
            <input type="number" id="f_score" value="${p.score_total}"></div>
          <div class="form-group"><label>时限 (ms)</label>
            <input type="number" id="f_tl" value="${p.time_limit}"></div>
          <div class="form-group"><label>内存 (MB)</label>
            <input type="number" id="f_ml" value="${p.memory_limit}"></div>
          <div class="form-group"><label>个人题位置 (0-4)</label>
            <input type="number" id="f_pos" value="${p.position??''}" min="0" max="4">
            <span class="form-hint">OIL 每位队员 2 道个人题，分数用本题满分</span></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>标签（逗号分隔）</label>
            <input type="text" id="f_tags" value="${esc(p.tags||'')}"></div>
          <div class="form-group"><label>出题人</label>
            <input type="text" id="f_author" value="${esc(p.author||'')}"
                   ${me && me.is_admin ? '' : 'readonly title="仅管理员可修改出题人"'}
                   placeholder="${esc((me&&(me.display_name||me.username))||'')}">
            <span class="form-hint">${me && me.is_admin ? '可指定任意出题人' : '出题负责人自动署名为本人'}</span></div>
          <div class="form-group" style="flex:0 0 auto"><label>公开可见</label>
            <select id="f_public">
              <option value="0" ${!p.is_public?'selected':''}>私有</option>
              <option value="1" ${p.is_public?'selected':''}>公开</option>
            </select>
            <span class="form-hint">属于未结束比赛的题目仍会被隐藏</span></div>
          <div class="form-group" style="flex:0 0 auto"><label>交互题</label>
            <select id="f_inter">
              <option value="0" ${!p.interactive?'selected':''}>否</option>
              <option value="1" ${p.interactive?'selected':''}>是</option>
            </select></div>
          <div class="form-group" style="flex:0 0 auto"><label>评测方式</label>
            <select id="f_checker" onchange="toggleSpj()">
              <option value="token" ${p.checker_type!=='spj'&&p.checker_type!=='functional'?'selected':''}>逐 token 比对（默认）</option>
              <option value="spj" ${p.checker_type==='spj'?'selected':''}>SPJ 特殊评测（testlib）</option>
              <option value="functional" ${p.checker_type==='functional'?'selected':''}>函数式交互</option>
            </select></div>
        </div>

        <div id="spj-box" style="display:none">
          <h3 style="margin:16px 0 8px;font-size:14px;">SPJ 特殊评测（C++ / testlib）</h3>
          <div class="form-hint" style="margin-bottom:8px">
            用 C++ 编写并 <code>#include "testlib.h"</code>；编译时会自动加上
            <code>-I data/lib</code>，无需手动放置 testlib.h。
            调用约定：<code>spj &lt;input&gt; &lt;output&gt; &lt;answer&gt;</code>，
            用 <code>quitf(_ok/_wa, "...")</code> 返回判定。
          </div>
          <div class="form-row"><div class="form-group">
            <div class="md-split">
              <textarea id="f_spj" rows="18" spellcheck="false"
                        oninput="updateSpjPreview()">${esc(p.spj_source||'')}</textarea>
              <div class="md-preview" id="f_spj_pv" style="padding:0"></div>
            </div>
          </div></div>
          <div class="flex gap8">
            <button class="btn btn-sm btn-default" onclick="loadSpjTemplate()">载入模板</button>
            ${p.id?`<button class="btn btn-sm btn-primary" onclick="compileSpj(${p.id})">编译 SPJ</button>`:
                   '<span class="muted" style="align-self:center">保存题目后可编译</span>'}
            <span style="align-self:center">${p.spj_compiled?'<span class="badge badge-AC">已编译</span>':'<span class="badge badge-PENDING">未编译</span>'}</span>
          </div>
          <div id="spj-log">${p.spj_log?`<div class="spj-log ${p.spj_compiled?'spj-ok':'spj-err'}">${esc(p.spj_log)}</div>`:''}</div>
        </div>

        <div id="func-box" style="display:none">
          <h3 style="margin:16px 0 8px;font-size:14px;">函数式交互</h3>
          <div class="form-hint" style="margin-bottom:8px">
            评测把选手代码与 <code>grader.cpp</code> 链在一起编译。
            <strong>main 写在 grader 里</strong>。选手只实现函数（如 <code>solve()</code>），不要写 main、不要读 stdin。
            <br>grader 的输入：
            <code>stdin</code> = 测试点 <code>.in</code>（可含隐藏数据，用来回答询问、强制在线）；
            <code>argv[1]</code> / 文件 <code>answer.out</code> = 测试点 <code>.out</code>（标准答案，不必在 grader 里内置标程）。
            <code>exit(0)</code>=AC，<code>exit(1)</code>=WA。
          </div>
          <div class="flex gap8" style="margin-bottom:8px">
            <button class="btn btn-sm btn-default" onclick="loadFuncTemplate()">载入模板</button>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:0 0 260px"><label>头文件名（选手 #include）</label>
              <input type="text" id="f_func_hname" value="${esc(p.interact_header_name||'interaction.h')}" placeholder="interaction.h">
              <span class="form-hint">选手 #include 的文件名，例如 <code>grader.h</code></span></div>
          </div>
          <div class="form-group"><label>头文件内容（选手可见）</label>
            <textarea id="f_func_h" rows="10" spellcheck="false">${esc(p.interact_header||'')}</textarea></div>
          <div class="form-group"><label>grader.cpp（实现，选手不可见）</label>
            <textarea id="f_func_g" rows="16" spellcheck="false">${esc(p.grader_source||'')}</textarea></div>
        </div>

        <h3 style="margin:16px 0 8px;font-size:14px;">文件流 IO（可选）</h3>
        <div class="form-hint" style="margin-bottom:8px">
          选手程序用文件读写而不是标准输入输出时填写。文件名可任意指定（例如 <code>problem1.in</code> / <code>problem1.out</code>），不必与 slug 相同。留空则使用 stdin/stdout。
        </div>
        <div class="form-row">
          <div class="form-group"><label>输入文件名</label>
            <input type="text" id="f_fio_in" value="${esc(p.file_io_in||'')}" placeholder="problem1.in"></div>
          <div class="form-group"><label>输出文件名</label>
            <input type="text" id="f_fio_out" value="${esc(p.file_io_out||'')}" placeholder="problem1.out"></div>
        </div>

        ${pid?`
        <h3 style="margin:16px 0 8px;font-size:14px;">附件</h3>
        <div class="form-hint" style="margin-bottom:8px">题面附加文件（PDF、图片、额外说明等），选手可在题目页下载。</div>
        <div id="attach-list">${(p.attachments||[]).map(a=>`
          <span class="file-chip">${esc(a.name)} <span class="muted">${a.size}B</span>
            <button type="button" onclick="delAttach(${pid},'${esc(a.name)}')">×</button></span>`).join('')||'<span class="muted">暂无附件</span>'}</div>
        <div class="form-row mt10">
          <div class="form-group"><input type="file" id="f_attach" multiple></div>
          <div class="form-group" style="flex:0 0 auto;justify-content:flex-end">
            <button type="button" class="btn btn-sm btn-default" onclick="uploadAttach(${pid})">上传附件</button></div>
        </div>`:''}

        <h3 style="margin:16px 0 8px;font-size:14px;">标程 std（Hack 必需）</h3>
        <div class="form-hint" style="margin-bottom:8px">
          每道题必须提供一份标准程序（C++20）。Hack 时会先用标程跑选手提供的输入：
          标程失败则数据非法（INVALID）。保存后写入 <code>data/problems/&lt;slug&gt;/ref.cpp</code>。
        </div>
        <div class="form-row"><div class="form-group">
          <div class="md-split">
            <textarea id="f_std" rows="16" spellcheck="false"
                      placeholder="#include &lt;bits/stdc++.h&gt;&#10;using namespace std;&#10;int main(){ ... }">${esc(p.std_source||'')}</textarea>
            <div class="md-preview" id="f_std_pv" style="padding:0"></div>
          </div>
        </div></div>

        <h3 style="margin:16px 0 8px;font-size:14px;">题面（支持 Markdown + LaTeX，右侧实时预览）</h3>
        ${mdField('题目背景（可留空，留空则不显示）','f_bg',p.background)}
        ${mdField('题目描述','f_desc',p.description)}
        ${mdField('输入格式','f_in',p.input_format)}
        ${mdField('输出格式','f_out',p.output_format)}
        <h3 style="margin:16px 0 8px;font-size:14px;">样例组</h3>
        <div class="form-hint" style="margin-bottom:8px">
          每组包含输入与输出，前台会分栏显示并各带「复制」按钮。说明栏支持 Markdown/LaTeX。
        </div>
        <div id="samples"></div>
        <button class="btn btn-sm btn-default" onclick="addSample()">+ 添加样例组</button>
        ${mdField('数据范围与约定','f_cons',p.constraints)}

        <h3 style="margin:16px 0 8px;font-size:14px;">评测结构</h3>
        <div class="form-row">
          <div class="form-group" style="flex:0 0 220px"><label>开启子任务</label>
            <select id="f_use_sub" onchange="onUseSubChange()">
              <option value="1" ${p.use_subtasks!=0?'selected':''}>开启（按子任务赋分）</option>
              <option value="0" ${p.use_subtasks==0?'selected':''}>关闭（按测试点赋分）</option>
            </select>
            <span class="form-hint">关闭后 <code>0_0.in</code> 只是测试点名，不会变成第 0 个子任务</span>
          </div>
        </div>
        <div class="form-group">
          <label>Hack 数据校验器（C++ / testlib，选填）</label>
          <span class="form-hint">不论是否开启子任务，Hack 都会先跑这份校验器；不通过则判定非法数据。开启子任务时也可在各子任务里另写校验器。</span>
          <textarea id="f_hack_val" rows="6" spellcheck="false">${esc(p.hack_validator||'')}</textarea>
        </div>
        <div id="subtasks"></div>
        <div class="flex gap8" style="flex-wrap:wrap">
          <button class="btn btn-sm btn-default" id="btn-add-st" onclick="addSubtask()">+ 添加子任务</button>
          <button class="btn btn-sm btn-default" onclick="evenSplitUI()">一键均分（洛谷式）</button>
          ${pid?`<button class="btn btn-sm btn-default" onclick="autodetect(${pid})">🔍 从数据目录自动识别</button>`:
                '<span class="muted">保存后可上传测试数据并自动识别</span>'}
        </div>

        <div class="mt10" style="border-top:1px solid #e3e9ef;padding-top:12px;">
          <button class="btn btn-primary" onclick="saveProblem()">保存题目</button>
          <a class="btn btn-default" href="/admin">取消</a>
          <span id="save-msg" class="muted" style="margin-left:10px"></span>
        </div>
      </div>
    </div>`;
  renderSubtaskEditor();
  renderSampleEditor();
  toggleSpj();
  updateSpjPreview();
  ['f_bg','f_desc','f_in','f_out','f_cons'].forEach(id=>{
    const ta=document.getElementById(id);
    ta.addEventListener('input',()=>updatePreview(id));
    updatePreview(id);
  });
}

function toggleSpj(){
  const v = document.getElementById('f_checker').value;
  document.getElementById('spj-box').style.display = v==='spj'?'block':'none';
  const fb=document.getElementById('func-box');
  if(fb) fb.style.display = v==='functional'?'block':'none';
}
async function loadFuncTemplate(){
  const t = await API.get('/api/admin/functional_template');
  document.getElementById('f_func_h').value = t.header;
  document.getElementById('f_func_g').value = t.grader;
  toast('已载入函数式交互模板','success');
}
async function loadSpjTemplate(){
  const t = await API.get('/api/admin/spj_template');
  if(!t.testlib_available) toast('警告：data/lib/testlib.h 未找到','error');
  document.getElementById('f_spj').value = t.template;
  updateSpjPreview();
}
function updateSpjPreview(){
  const ta = document.getElementById('f_spj');
  const pv = document.getElementById('f_spj_pv');
  if(!ta || !pv) return;
  // Degrade to plain text if app.js failed to load, rather than throwing and
  // aborting whatever called us (e.g. saving the problem).
  const body = (typeof highlightCpp === 'function')
    ? highlightCpp(ta.value)
    : esc(ta.value);
  pv.innerHTML = `<pre class="code-body" style="margin:0;max-height:430px;overflow:auto"><code>${body}</code></pre>`;
}
async function compileSpj(pid){
  const box=document.getElementById('spj-log');
  box.innerHTML='<div class="spj-log">编译中...</div>';
  try{
    // save the source first so we compile exactly what is on screen
    await saveProblem(true);
    const r = await API.post(`/api/admin/problem/${pid}/compile_spj`,{});
    box.innerHTML=`<div class="spj-log ${r.ok?'spj-ok':'spj-err'}">${esc(r.log||'(无输出)')}</div>`;
    toast(r.ok?'SPJ 编译成功':'SPJ 编译失败', r.ok?'success':'error');
  }catch(e){
    box.innerHTML=`<div class="spj-log spj-err">${esc(e.message)}</div>`;
    toast(e.message,'error');
  }
}

function mdField(label,id,val){
  return `<div class="form-row"><div class="form-group" style="flex:1">
      <label>${label}</label>
      <div class="md-split">
        <textarea id="${id}" rows="8">${esc(val||'')}</textarea>
        <div class="md-preview problem-body-inner" id="${id}_pv"></div>
      </div>
      <span class="form-hint">行内公式 $x^2$ ，行间公式 $$\\sum_{i=1}^n a_i$$</span>
    </div></div>`;
}
function updatePreview(id){
  document.getElementById(id+'_pv').innerHTML = renderStatement(document.getElementById(id).value);
}

function renderSampleEditor(){
  if(!Array.isArray(editing.sample_groups)) editing.sample_groups=[];
  // one-time migration: keep an old free-text sample visible as group 1
  if(!editing.sample_groups.length && (editing.samples||'').trim()){
    editing.sample_groups=[{input:editing.samples.trim(),output:'',note:''}];
  }
  const gs=editing.sample_groups;
  document.getElementById('samples').innerHTML = gs.map((g,i)=>`
    <div class="subtask-editor">
      <div class="flex-between" style="margin-bottom:6px">
        <strong style="font-size:13px">样例 ${i+1}</strong>
        <button class="btn btn-sm btn-danger" onclick="editing.sample_groups.splice(${i},1);renderSampleEditor()">删除</button>
      </div>
      <div class="md-split">
        <div class="form-group"><label>输入</label>
          <textarea rows="6" spellcheck="false"
            oninput="editing.sample_groups[${i}].input=this.value">${esc(g.input||'')}</textarea></div>
        <div class="form-group"><label>输出</label>
          <textarea rows="6" spellcheck="false"
            oninput="editing.sample_groups[${i}].output=this.value">${esc(g.output||'')}</textarea></div>
      </div>
      <div class="form-group"><label>样例说明（可选）</label>
        <textarea rows="2" oninput="editing.sample_groups[${i}].note=this.value">${esc(g.note||'')}</textarea></div>
    </div>`).join('') || '<div class="muted">暂无样例组。</div>';
}
function addSample(){
  editing.sample_groups=editing.sample_groups||[];
  editing.sample_groups.push({input:'',output:'',note:''});
  renderSampleEditor();
}

function useSubOn(){
  const el=document.getElementById('f_use_sub');
  return el ? el.value==='1' : (editing.use_subtasks!=0);
}
function flattenCases(){
  const out=[];
  (editing.subtasks||[]).forEach(st=>{
    (st.testcases||[]).forEach(c=>out.push({
      input:c.input||'', output:c.output||'', score:parseInt(c.score||0)||0
    }));
  });
  return out;
}
function evenSplitArr(total,n){
  total=parseInt(total)||0; n=parseInt(n)||0;
  if(n<=0) return [];
  const base=Math.floor(Math.max(0,total)/n);
  let rem=Math.max(0,total)%n;
  const arr=Array(n).fill(base);
  for(let i=n-1;i>=0 && rem>0;i--){ arr[i]+=1; rem--; }
  return arr;
}
function evenSplitUI(){
  const total=parseInt(document.getElementById('f_score').value)||0;
  if(useSubOn()){
    const n=(editing.subtasks||[]).length;
    if(!n){ toast('没有子任务','error'); return; }
    const arr=evenSplitArr(total,n);
    editing.subtasks.forEach((st,i)=>st.score=arr[i]);
    renderSubtaskEditor();
    toast('已按子任务均分','success');
  }else{
    const cases=flattenCases();
    if(!cases.length){ toast('没有测试点','error'); return; }
    const arr=evenSplitArr(total,cases.length);
    cases.forEach((c,i)=>c.score=arr[i]);
    editing.subtasks=[{name:'测试点',score:0,per_case:true,testcases:cases,
                       validator:document.getElementById('f_hack_val').value||''}];
    renderSubtaskEditor();
    toast('已按测试点均分（余数从后往前 +1）','success');
  }
}
function onUseSubChange(){
  const on=useSubOn();
  const cases=flattenCases();
  if(on){
    if(!editing.subtasks || (editing.subtasks.length===1 && editing.subtasks[0].per_case)){
      editing.subtasks=[{name:'Subtask 1',score:parseInt(document.getElementById('f_score').value)||0,
                         testcases:cases.map(c=>({input:c.input,output:c.output})),validator:''}];
    }
  }else{
    editing.subtasks=[{name:'测试点',score:0,per_case:true,testcases:cases,
                       validator:document.getElementById('f_hack_val').value||''}];
  }
  renderSubtaskEditor();
}
function renderSubtaskEditor(){
  const addBtn=document.getElementById('btn-add-st');
  if(addBtn) addBtn.style.display=useSubOn()?'inline-flex':'none';
  if(!useSubOn()){
    const cases=flattenCases();
    if(!editing.subtasks||!editing.subtasks.length)
      editing.subtasks=[{name:'测试点',score:0,per_case:true,testcases:cases}];
    editing.subtasks[0].per_case=true;
    editing.subtasks[0].testcases=cases;
    document.getElementById('subtasks').innerHTML = `
      <div class="form-hint" style="margin-bottom:8px">为每个测试点赋分。文件名如 <code>0_0.in</code> 仅作编号，不会开成第 0 个子任务。</div>
      <table><thead><tr><th>#</th><th>输入</th><th>输出</th><th>分值</th><th></th></tr></thead><tbody>
        ${cases.map((c,i)=>`<tr>
          <td class="mono">${i+1}</td>
          <td><input type="text" value="${esc(c.input||'')}" onchange="setFlatCase(${i},'input',this.value)"></td>
          <td><input type="text" value="${esc(c.output||'')}" onchange="setFlatCase(${i},'output',this.value)"></td>
          <td style="width:90px"><input type="number" value="${c.score||0}" onchange="setFlatCase(${i},'score',parseInt(this.value)||0)"></td>
          <td><button class="btn btn-sm btn-danger" onclick="delFlatCase(${i})">删除</button></td>
        </tr>`).join('')||'<tr><td colspan="5" class="muted">暂无测试点。可自动识别或手动添加。</td></tr>'}
      </tbody></table>
      <button class="btn btn-sm btn-default mt10" onclick="addFlatCase()">+ 添加测试点</button>`;
    return;
  }
  const sts = editing.subtasks||[];
  document.getElementById('subtasks').innerHTML = sts.map((st,i)=>`
    <div class="subtask-editor">
      <div class="form-row" style="margin-bottom:6px">
        <div class="form-group"><label>子任务 ${i+1} 名称</label>
          <input type="text" value="${esc(st.name||'')}" onchange="editing.subtasks[${i}].name=this.value"></div>
        <div class="form-group" style="flex:0 0 110px"><label>分值</label>
          <input type="number" value="${st.score||0}" onchange="editing.subtasks[${i}].score=parseInt(this.value)||0"></div>
        <div class="form-group" style="flex:0 0 auto;justify-content:flex-end">
          <button class="btn btn-sm btn-danger" onclick="editing.subtasks.splice(${i},1);renderSubtaskEditor()">删除</button></div>
      </div>
      <div class="form-group"><label>测试点（每行一组：输入文件 输出文件）</label>
        <textarea rows="${Math.max(2,(st.testcases||[]).length)}"
          onchange="setCases(${i},this.value)">${(st.testcases||[]).map(c=>`${c.input} ${c.output}`).join('\n')}</textarea></div>
      <div class="form-group"><label>子任务数据校验器（C++ / testlib，可空）</label>
        <span class="form-hint">Hack 该子任务时会先跑校验器；不通过则判定为非法数据，不能 Hack。</span>
        <textarea rows="6" spellcheck="false"
          onchange="editing.subtasks[${i}].validator=this.value">${esc(st.validator||'')}</textarea></div>
    </div>`).join('') || '<div class="muted">暂无子任务。无子任务的题目将无法获得分数。</div>';
}
function setFlatCase(i,key,val){
  const cases=flattenCases();
  if(!cases[i]) return;
  cases[i][key]=val;
  editing.subtasks=[{name:'测试点',score:0,per_case:true,testcases:cases,
                     validator:document.getElementById('f_hack_val').value||''}];
}
function addFlatCase(){
  const cases=flattenCases();
  cases.push({input:'',output:'',score:0});
  editing.subtasks=[{name:'测试点',score:0,per_case:true,testcases:cases}];
  renderSubtaskEditor();
}
function delFlatCase(i){
  const cases=flattenCases();
  cases.splice(i,1);
  editing.subtasks=[{name:'测试点',score:0,per_case:true,testcases:cases}];
  renderSubtaskEditor();
}
function setCases(i,val){
  editing.subtasks[i].testcases = val.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts=l.split(/\s+/);
    return {input:parts[0]||'', output:parts[1]||''};
  });
}
function addSubtask(){
  editing.subtasks = editing.subtasks||[];
  editing.subtasks.push({name:`Subtask ${editing.subtasks.length+1}`,score:0,testcases:[],validator:''});
  renderSubtaskEditor();
}
async function autodetect(pid){
  try{
    await saveProblem(true);
    const r = await API.post(`/api/admin/problem/${pid}/autodetect`,{});
    editing.subtasks = r.subtasks;
    if(r.use_subtasks!=null){
      const sel=document.getElementById('f_use_sub');
      if(sel) sel.value=r.use_subtasks? '1':'0';
    }
    renderSubtaskEditor();
    const n=(r.subtasks||[]).reduce((a,st)=>a+(st.testcases||[]).length,0);
    toast(r.use_subtasks?`已识别 ${r.subtasks.length} 个子任务`:`已识别 ${n} 个测试点`,'success');
  }catch(e){ toast(e.message,'error'); }
}

async function saveProblem(quiet){
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const payload={
    id: editing.id||undefined, slug:g('f_slug'), title:g('f_title'),
    description:g('f_desc'), input_format:g('f_in'), output_format:g('f_out'),
    samples:'', sample_groups: JSON.stringify(editing.sample_groups||[]),
    background:g('f_bg'), constraints:g('f_cons'),
    time_limit:g('f_tl'), memory_limit:g('f_ml'), problem_type:g('f_type'),
    score_total:g('f_score'), difficulty:g('f_diff'), is_public:g('f_public'),
    tags:g('f_tags'), interactive:g('f_inter'),
    checker_type:g('f_checker'), spj_source:g('f_spj'), std_source:g('f_std'), author:g('f_author'),
    file_io_in:g('f_fio_in'), file_io_out:g('f_fio_out'),
    grader_source:g('f_func_g'), interact_header:g('f_func_h'),
    interact_header_name:g('f_func_hname') || 'interaction.h',
    use_subtasks: useSubOn() ? '1' : '0',
    hack_validator: g('f_hack_val'),
    subtasks: JSON.stringify(editing.subtasks||[]),
  };
  const pos=g('f_pos'); if(pos!=='') payload.position=pos;
  try{
    const r=await API.post('/api/admin/problem',payload);
    if(quiet) return r;
    toast('保存成功','success');
    if(!editing.id){                       // newly created -> move to its edit URL
      history.replaceState(null, '', `/admin/problem/${r.id}`);
      document.getElementById('ptitle').textContent = `编辑题目 #${r.id}`;
    }
    await editProblem(r.id);
    return r;
  }catch(e){ toast(e.message,'error'); if(quiet) throw e; }
}

async function uploadAttach(pid){
  const inp=document.getElementById('f_attach');
  if(!inp || !inp.files || !inp.files.length){ toast('请选择附件','error'); return; }
  const fd=new FormData();
  for(const f of inp.files) fd.append('files', f);
  try{
    const r=await fetch(`/api/admin/problem/${pid}/attach`, {method:'POST', body:fd});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.detail||'上传失败');
    toast('已上传 '+(j.saved||[]).join(', '),'success');
    await editProblem(pid);
  }catch(e){ toast(e.message,'error'); }
}
async function delAttach(pid, name){
  if(!confirm('删除附件 '+name+'？')) return;
  try{
    await API.post(`/api/admin/problem/${pid}/attach/delete`, {name});
    toast('已删除','success');
    await editProblem(pid);
  }catch(e){ toast(e.message,'error'); }
}

(async()=>{
  me = await loadMe();
  renderLayout(me, 'admin');
  if(!me || !(me.is_admin || me.is_manager)){
    document.getElementById('editor').innerHTML =
      `<div class="card"><div class="card-body">
        <div class="alert alert-error">需要管理员或出题负责人权限。</div>
        <a href="/login" class="btn btn-primary">前往登录</a></div></div>`;
    return;
  }
  document.getElementById('ptitle').textContent = PID ? `编辑题目 #${PID}` : '新建题目';
  await editProblem(PID);
})();
</script>
</body>
