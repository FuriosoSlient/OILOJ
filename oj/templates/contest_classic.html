<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>比赛 - OIL OJ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div class="title" id="ctitle">比赛</div>
      <div style="flex:1"></div>
      <span id="phase-chip"></span>
      <span class="mono" id="clock" style="margin-left:12px;font-size:15px"></span>
      <a href="#" id="standings-link" class="btn btn-sm btn-default" style="margin-left:12px">榜单</a>
      <a href="/contests" class="btn btn-sm btn-default" style="margin-left:8px">全部比赛</a>
    </div>
    <div class="content" id="app"><div class="loading">加载中...</div></div>
  </main>
</div>
<script src="/static/app.js"></script>
<script>
const cid=parseInt(location.pathname.split('/')[2]);
document.getElementById('standings-link').href=`/contest/${cid}/standings`;
let me=null, C=null, evt=null;

function render(){
  const s=C.state||{};
  const mode=(C.mode||s.mode||'ioi').toUpperCase();
  document.getElementById('ctitle').textContent =
    `${C.label||('比赛 #'+C.id)} · ${C.name||''}  [${mode}${C.is_rated?' · Rated':''}]`;
  document.getElementById('phase-chip').innerHTML =
    `<span class="phase-chip phase-${s.phase}">${phaseLabel(s.phase)}</span>`;
  document.getElementById('clock').textContent =
    (s.phase==='after' && !s.virtual_active)?'已结束':fmtClock(s.remaining);
  const probs=(s.problems||[]).filter(p=>p.visible);
  const rank=s.ranking||[];
  const n=C.registered_count||(s.registered_count||0);
  const reg=C.registered||s.viewer_registered;
  const canReg=s.can_register;
  let regBar='';
  if(me){
    if(s.virtual_active){
      regBar=`<div class="alert alert-info">虚拟参赛进行中：榜单按相对时间回放正式选手的提交，你的提交单独计入 VP，不影响 Rating。
        剩余 <strong class="mono">${fmtClock(s.remaining)}</strong></div>`;
    }else if(s.viewer_is_virtual){
      regBar=`<div class="alert alert-success">你的虚拟参赛已结束。下方榜单为全程回放 + 你的 VP 成绩（不计入 Rating）。</div>`;
    }else if(reg){
      regBar=`<div class="alert alert-success">你已报名（当前 ${n} 人）。${C.is_rated?'本场 Rated，结束后按报名选手成绩更新 Rating。':''}
        ${s.phase==='before'?`<button class="btn btn-sm btn-default" style="margin-left:8px" onclick="doUnreg()">取消报名</button>`:''}</div>`;
    }else if(canReg){
      regBar=`<div class="alert alert-warn">请先报名才能提交并计入榜单 / Rating。已报名 ${n} 人。
        <button class="btn btn-sm btn-primary" style="margin-left:8px" onclick="doReg()">报名参加</button></div>`;
    }else if(s.can_virtual){
      regBar=`<div class="alert alert-warn">比赛已结束。可以像 Codeforces 一样虚拟参赛：计时重新开始，榜单按相对时间模拟其他选手提交。
        <button class="btn btn-sm btn-primary" style="margin-left:8px" onclick="doVP()">开始虚拟参赛</button></div>`;
    }else{
      regBar=`<div class="alert alert-info">比赛已结束。报名人数 ${n}。</div>`;
    }
  }else{
    regBar=`<div class="alert alert-info">登录后可报名或虚拟参赛。已报名 ${n} 人。</div>`;
  }
  document.getElementById('app').innerHTML=`
    ${C.description?`<div class="card"><div class="card-body">${esc(C.description)}</div></div>`:''}
    ${regBar}
    <div class="card">
      <div class="card-header">题目</div>
      <table><thead><tr><th>#</th><th>标题</th><th>满分</th><th></th></tr></thead>
      <tbody>${probs.map((p,i)=>`<tr>
        <td class="mono">${String.fromCharCode(65+i)}</td>
        <td><a href="/problem/${p.id}?contest_id=${cid}">${esc(p.title||'—')}</a></td>
        <td class="mono">${p.score_total}</td>
        <td>${p.can_submit?`<a class="btn btn-sm btn-primary" href="/problem/${p.id}?contest_id=${cid}">提交</a>`:''}</td>
      </tr>`).join('')||'<tr><td colspan="4" class="muted">题目尚未公布</td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <div class="card-header">实时榜单</div>
      <div style="overflow-x:auto">${s.results_hidden
        ? '<div class="alert alert-info" style="margin:12px">OI 赛制：赛时不公布评测结果与榜单，结束后公开。管理员 / 本场负责人仍可查看。</div>'
        : classicBoard(s, C)}</div>
    </div>`;
}
function classicCell(mode, cell, full){
  if(mode==='icpc'){
    if(cell && cell.solved){
      const tries = cell.attempts||1;
      const fails = Math.max(0, tries-1);
      const top = fails===0 ? '✓' : String(fails);
      return `<td class="mono" style="color:#52c41a;font-weight:600;line-height:1.25">
        <div>${top}</div>
        <div style="font-size:11px;font-weight:400;color:#389e0d">${cell.time}′</div></td>`;
    }
    if(cell && cell.attempts)
      return `<td class="mono" style="color:#d83b3b">-${cell.attempts}</td>`;
    return `<td class="muted">·</td>`;
  }
  const v = (typeof cell==='number') ? cell : (cell && cell.score) || 0;
  if(!v) return `<td class="muted">·</td>`;
  const ok = full && v>=full;
  return `<td class="mono" style="color:${ok?'#52c41a':'#d48806'};font-weight:600">${v}${full?`/${full}`:''}</td>`;
}
function classicBoard(s, C){
  const mode=(C.mode||s.mode||'ioi');
  const icpc=mode==='icpc';
  const probs=(s.problems||[]).filter(p=>s.phase==='before'||p.visible!==false);
  const rank=s.ranking||[];
  if(!rank.length) return '<div class="muted" style="padding:20px">暂无报名选手</div>';
  let h=`<table class="standings-table"><thead><tr>
    <th>名次</th><th style="text-align:left">选手</th>
    <th>${icpc?'过题':'总分'}</th>${icpc?'<th>罚时</th>':''}`;
  probs.forEach((p,i)=>{
    const letter=String.fromCharCode(65+i);
    h+=`<th>${letter}<div class="muted" style="font-weight:400;font-size:11px">${esc(p.title||'')}${p.score_total!=null?' · '+p.score_total+'分':''}</div></th>`;
  });
  h+='</tr></thead><tbody>';
  rank.forEach(r=>{
    h+=`<tr>
      <td class="mono">${r.rank}</td>
      <td style="text-align:left">${r.user_id?`<a href="/user/${r.user_id}">${esc(r.display_name||r.name||'')}</a>`:esc(r.display_name||r.name||'')}${r.virtual?' <span class="badge badge-PENDING">VP</span>':''}</td>
      <td class="mono"><strong>${r.score??r.solved??0}</strong></td>
      ${icpc?`<td class="mono">${r.penalty||0}</td>`:''}`;
    probs.forEach(p=> h+=classicCell(mode, (r.problems||{})[String(p.id)], p.score_total));
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
async function doReg(){
  try{ await API.post(`/api/contest/${cid}/register`,{}); toast('报名成功','success'); await load(); }
  catch(e){ toast(e.message,'error'); }
}
async function doUnreg(){
  if(!confirm('确定取消报名？')) return;
  try{ await API.post(`/api/contest/${cid}/unregister`,{}); toast('已取消报名','success'); await load(); }
  catch(e){ toast(e.message,'error'); }
}
async function doVP(){
  if(!confirm('开始虚拟参赛？计时将从现在起按原比赛时长走，期间榜单按相对时间回放正式选手提交。正式成绩与 Rating 不受影响。')) return;
  try{ await API.post(`/api/contest/${cid}/virtual/start`,{}); toast('虚拟参赛已开始','success'); await load(); }
  catch(e){ toast(e.message,'error'); }
}
async function load(){
  try{
    C=await API.get(`/api/contest/${cid}`);
    render();
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}
function connect(){
  if(evt) evt.close();
  evt=new EventSource(`/api/contest/${cid}/stream`);
  evt.onmessage=ev=>{ try{ const st=JSON.parse(ev.data); if(C){ C.state=st; render(); } }catch(e){} };
}
(async()=>{
  me=await loadMe(); renderLayout(me,'contests');
  await load(); connect();
})();
</script>
</body>
</html>
