<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实时榜单 - OIL OJ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div class="title" id="ctitle">实时榜单</div>
      <div style="flex:1"></div>
      <span id="phase-chip"></span>
      <span class="mono" id="clock" style="margin-left:12px;font-size:15px"></span>
      <a href="#" id="back" class="btn btn-sm btn-default" style="margin-left:12px">← 返回比赛</a>
    </div>
    <div class="content">
      <div class="card">
        <div class="card-header"><span class="live-dot"></span>队伍总分</div>
        <div class="card-body" id="teams"></div>
      </div>
      <div class="card">
        <div class="card-header">分数变化折线图</div>
        <div class="card-body">
          <div class="flex gap8" style="margin-bottom:8px">
            <button class="btn btn-sm btn-primary" id="btn-team" onclick="setMode('teams')">按队伍</button>
            <button class="btn btn-sm btn-default" id="btn-user" onclick="setMode('users')">按选手</button>
          </div>
          <svg class="score-chart" id="chart" preserveAspectRatio="none"></svg>
          <div class="chart-legend" id="legend"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">明细</div>
        <div style="overflow-x:auto"><div id="detail"></div></div>
      </div>
    </div>
  </main>
</div>

<script src="/static/app.js"></script>
<script>
const cid=parseInt(location.pathname.split('/')[2]);
let me=null, S=null, mode='teams', tick=0;

document.getElementById('back').href=`/contest/${cid}`;

function setMode(m){
  mode=m;
  document.getElementById('btn-team').className='btn btn-sm '+(m==='teams'?'btn-primary':'btn-default');
  document.getElementById('btn-user').className='btn btn-sm '+(m==='users'?'btn-primary':'btn-default');
  draw();
}

function seriesKeys(){
  if(mode==='teams') return S.teams.map(t=>({id:String(t.id),name:t.name,color:t.color}));
  const out=[];
  S.teams.forEach(t=>t.members.forEach(m=>out.push({id:String(m.id),name:m.display_name,color:t.color})));
  return out;
}

// Hand-rolled SVG line chart: no external chart library, works fully offline.
function draw(){
  const svg=document.getElementById('chart');
  const keys=seriesKeys();
  const pts=S.series||[];
  if(pts.length<1 || !keys.length){ svg.innerHTML=''; return; }

  const W=svg.clientWidth||900, H=340, pad={l:52,r:18,t:14,b:34};
  const t0=pts[0].ts, t1=Math.max(pts[pts.length-1].ts, t0+1);
  let maxY=10;
  pts.forEach(p=>keys.forEach(k=>{ const v=(p[mode]||{})[k.id]||0; if(v>maxY) maxY=v; }));
  maxY=Math.ceil(maxY*1.12/10)*10;

  const X=t=>pad.l+(t-t0)/(t1-t0)*(W-pad.l-pad.r);
  const Y=v=>H-pad.b-(v/maxY)*(H-pad.t-pad.b);

  let g='';
  // horizontal gridlines + y labels
  for(let i=0;i<=5;i++){
    const v=maxY*i/5, y=Y(v);
    g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#eef2f6" stroke-width="1"/>`;
    g+=`<text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#93a5b5">${Math.round(v)}</text>`;
  }
  // x axis time labels
  for(let i=0;i<=4;i++){
    const t=t0+(t1-t0)*i/4, x=X(t);
    const d=new Date(t*1000);
    const lbl=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    g+=`<text x="${x}" y="${H-pad.b+18}" text-anchor="middle" font-size="11" fill="#93a5b5">${lbl}</text>`;
  }
  g+=`<line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="#d6dee6"/>`;
  g+=`<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H-pad.b}" stroke="#d6dee6"/>`;

  // step lines (scores change discretely)
  keys.forEach(k=>{
    let d='', prev=null;
    pts.forEach(p=>{
      const v=(p[mode]||{})[k.id]||0, x=X(p.ts), y=Y(v);
      if(prev===null){ d=`M ${x} ${y}`; }
      else { d+=` L ${x} ${prev} L ${x} ${y}`; }
      prev=y;
    });
    g+=`<path d="${d}" fill="none" stroke="${esc(k.color||'#2f7ed8')}" stroke-width="2.2"
         stroke-linejoin="round" opacity="0.9"/>`;
    const last=pts[pts.length-1];
    const lv=(last[mode]||{})[k.id]||0;
    g+=`<circle cx="${X(last.ts)}" cy="${Y(lv)}" r="3.6" fill="${esc(k.color||'#2f7ed8')}"/>`;
  });

  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=g;
  document.getElementById('legend').innerHTML=keys.map(k=>{
    const last=pts[pts.length-1];
    const v=(last[mode]||{})[k.id]||0;
    return `<span><i class="legend-swatch" style="background:${esc(k.color||'#2f7ed8')}"></i>
      ${esc(k.name)} <strong class="mono">${v}</strong></span>`;
  }).join('');
}

function renderTeams(){
  document.getElementById('teams').innerHTML=S.teams.map((t,i)=>`
    <div class="flex-between rank-${i+1}" style="padding:10px 6px;border-bottom:1px solid #eef2f6">
      <div class="flex gap8" style="align-items:center">
        <span style="font-size:20px;font-weight:700;color:#93a5b5;width:28px">${i+1}</span>
        <span style="width:12px;height:12px;border-radius:50%;background:${esc(t.color)};display:inline-block"></span>
        <strong style="font-size:16px">${esc(t.name)}</strong>
      </div>
      <div class="mono" style="font-size:22px;font-weight:700;color:${esc(t.color)}">${t.total}</div>
    </div>`).join('');
}

function renderDetail(){
  const probs=S.problems||[];
  let h=`<table class="standings-table"><thead><tr>
    <th style="text-align:left">选手</th><th>个人题</th><th>Hack 得分</th><th>小计</th>`;
  probs.filter(p=>p.slot!=='' && !p.slot.startsWith('personal:')).forEach(p=>{
    h+=`<th>${esc(p.title||'???')}<div class="muted" style="font-weight:400;font-size:11px">${p.score_total}分</div></th>`;
  });
  h+=`</tr></thead><tbody>`;
  S.teams.forEach(t=>{
    t.members.forEach((m,i)=>{
      h+=`<tr><td style="text-align:left">
            <span style="width:9px;height:9px;border-radius:50%;background:${esc(t.color)};display:inline-block;margin-right:6px"></span>
            ${esc(m.display_name)} ${m.locked?'<span class="badge badge-AC" style="font-size:10px">已锁题</span>':''}</td>
          <td class="mono">${m.personal_total}</td>
          <td class="mono">${m.attacker_gain?'+'+m.attacker_gain:'-'}</td>
          <td class="mono"><strong>${m.personal_total+m.attacker_gain}</strong></td>`;
      if(i===0){
        probs.filter(p=>!p.slot.startsWith('personal:')).forEach(p=>{
          const sc=S.team_problem_score[`${t.id}:${p.id}`];
          h+=`<td class="mono" rowspan="${t.members.length}" style="background:#fafcfe">
              ${sc===undefined?'-':sc}</td>`;
        });
      }
      h+=`</tr>`;
    });
    h+=`<tr class="team-row"><td style="text-align:left">${esc(t.name)} 总分</td>
        <td colspan="${3+probs.filter(p=>!p.slot.startsWith('personal:')).length}" class="mono"
        style="font-size:16px;color:${esc(t.color)}">${t.total}</td></tr>`;
  });
  return h+'</tbody></table>';
}

async function refresh(){
  try{
    S=await API.get(`/api/contest/${cid}/standings`);
  }catch(e){ return; }
  document.getElementById('phase-chip').innerHTML=
    `<span class="phase-chip phase-${S.phase}">${phaseLabel(S.phase)}</span>`;
  renderTeams();
  draw();
  document.getElementById('detail').innerHTML=renderDetail();
}

setInterval(()=>{
  if(!S) return;
  if(S.phase==='solve'||S.phase==='hack'){
    S.remaining=Math.max(0,S.remaining-1);
    document.getElementById('clock').textContent=fmtClock(S.remaining);
    if(++tick%5===0) refresh();
  }
},1000);

window.addEventListener('resize',()=>{ if(S) draw(); });

(async()=>{
  me=await loadMe(); renderLayout(me,'contests');
  const c=await API.get(`/api/contest/${cid}`).catch(()=>null);
  if(c) document.getElementById('ctitle').textContent=(c.label||c.name)+' · 实时榜单';
  refresh();
})();
</script>
</body>
</html>
