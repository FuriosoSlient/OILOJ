<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>题目 - OIL OJ</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar"><div class="title" id="ptitle">题目</div>
      <div style="flex:1"></div>
      <a href="/contests" class="btn btn-sm btn-default" id="back-contest" style="display:none;">← 返回比赛</a>
    </div>
    <div class="content">
      <div class="grid2" id="grid">
        <div class="card">
          <div class="card-header"><span id="title"></span></div>
          <div class="card-body problem-body" id="stmt"></div>
        </div>
        <div>
          <div class="card">
            <div class="card-header">提交 <span style="font-size:12px;color:#999;font-weight:400;">仅支持 GNU C++20</span></div>
            <div class="card-body">
              <div class="editor-wrap">
                <div class="editor-toolbar">
                  <span>C++20 源码</span>
                  <div class="flex gap8">
                    <button class="btn btn-sm btn-default" onclick="loadSample()">填入示例</button>
                    <button class="btn btn-sm btn-default" id="hl-btn" onclick="toggleHighlight()">语法高亮</button>
                  </div>
                </div>
                <textarea class="code-editor mono" id="code" placeholder="// 在此输入你的 C++20 代码..."></textarea>
                <div id="code-preview" style="display:none"></div>
              </div>
              <div class="mt10 flex-between">
                <span class="muted" id="submit-hint"></span>
                <button class="btn btn-primary" id="submit-btn" onclick="doSubmit()">提交评测</button>
              </div>
              <div id="result"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">我的提交</div>
            <div style="max-height:300px;overflow-y:auto;">
              <table id="subs"><thead><tr><th>#</th><th>结果</th><th>分数</th><th>时间</th></tr></thead><tbody></tbody></table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/static/vendor/marked/marked.min.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/vendor/katex/auto-render.min.js"></script>
<script src="/static/vendor/dompurify/purify.min.js"></script>
<script src="/static/app.js"></script>
<script>
const pid=parseInt(location.pathname.split('/').pop());
const params=new URLSearchParams(location.search);
const contestId=params.get('contest_id')? parseInt(params.get('contest_id')) : null;
let problem=null, me=null;

const SAMPLE_CODE={
  default:`#include <bits/stdc++.h>
using namespace std;
int main(){
    ios::sync_with_stdio(false);
    cin.tie(nullptr);
    // your code here
    return 0;
}
`};

function loadSample(){
  if(problem && problem.functional){
    document.getElementById('code').value=
`#include "interaction.h"

void solve(){
    int n = get_n();
    // 通过 query / answer 交互，不要读 stdin，不要写 main
    answer(n);
}
`;
    return;
  }
  document.getElementById('code').value=SAMPLE_CODE.default;
}

// Toggle between the plain editor and a read-only highlighted view.
function toggleHighlight(){
  const ta=document.getElementById('code');
  const pv=document.getElementById('code-preview');
  const btn=document.getElementById('hl-btn');
  if(pv.style.display==='none'){
    const body=(typeof highlightCpp==='function')?highlightCpp(ta.value):esc(ta.value);
    pv.innerHTML=`<pre class="code-body" style="margin:0;max-height:420px;overflow:auto"><code>${body}</code></pre>`;
    pv.style.display='block'; ta.style.display='none'; btn.textContent='继续编辑';
  }else{
    pv.style.display='none'; ta.style.display='block'; btn.textContent='语法高亮';
  }
}

function renderCaseGrid(cases){
  if(!cases||!cases.length) return '';
  return '<div class="mt10" style="display:flex;flex-wrap:wrap;gap:4px;">'+cases.map(c=>{
    const col={AC:'#52c41a',WA:'#d83b3b',TLE:'#e67e22',MLE:'#9d3dcf',RE:'#c0392b',SE:'#666'}[c.status]||'#bbb';
    return `<span title="${esc(c.case||'')} ${esc(c.status)}" style="width:22px;height:22px;border-radius:3px;
      background:${col};color:#fff;font-size:10px;display:inline-flex;align-items:center;
      justify-content:center;">${esc(c.status)}</span>`;
  }).join('')+'</div>';
}

function perCaseMode(){
  return problem && (problem.use_subtasks==0 || (problem.subtasks&&problem.subtasks[0]&&problem.subtasks[0].per_case));
}
function renderSubtasks(subtask_scores, cases){
  if(perCaseMode() && cases && cases.length){
    return '<div class="mt10">'+cases.map((c,i)=>{
      const mx=c.max_score!=null?c.max_score:0;
      const got=c.score!=null?c.score:(c.status==='AC'?mx:0);
      const cls = c.status==='AC' ? 'subtask-ok' : 'muted';
      return `<div class="subtask-row"><span class="subtask-name">${esc(c.case||('#'+(i+1)))}</span>
        <span class="subtask-score ${cls}">${got} / ${mx} · ${esc(c.status||'')}</span></div>`;
    }).join('')+'</div>';
  }
  if(!problem.subtasks||!problem.subtasks.length) return '';
  return '<div class="mt10">'+problem.subtasks.map((st,i)=>{
    const got=subtask_scores[i]||0;
    const cls = got>0 ? (got>=st.score?'subtask-ok':'subtask-hacked') : '';
    return `<div class="subtask-row"><span class="subtask-name">${esc(st.name)}</span>
      <span class="subtask-score ${cls}">${got} / ${st.score}</span></div>`;
  }).join('')+'</div>';
}

async function doSubmit(){
  const code=document.getElementById('code').value;
  if(!code.trim()){toast('请输入代码','error');return;}
  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='提交中...';
  try{
    const payload={problem_id:pid,code};
    if(contestId) payload.contest_id=contestId;
    const r=await API.post('/api/submit',payload);
    document.getElementById('result').innerHTML=`<div class="alert alert-info">提交 #${r.submission_id} 已加入评测队列...</div>`;
    await followSubmission(r.submission_id, s=>{
      if(s.score!=null) window.__lastScore=s.score;
      if(s.status==='PENDING'||s.status==='JUDGING'){
        const done=(s.case_results||[]).length;
        document.getElementById('result').innerHTML=
          `<div class="alert alert-info"><span class="live-dot"></span>提交 #${s.id} 评测中${done?`（已完成 ${done} 个测试点）`:'...'}
           ${renderCaseGrid(s.case_results||[])}</div>`;
      } else if(s.oi_hidden || s.status==='SUBMITTED'){
        document.getElementById('result').innerHTML=
          `<div class="alert alert-info">提交 #${s.id} 已受理。OI 赛制赛时不公布评测结果，结束后可查看。</div>`;
      } else {
        const cls = s.status==='AC'?'success':(s.score>0?'warn':'error');
        document.getElementById('result').innerHTML=
          `<div class="alert alert-${cls}">
            <div><strong>#${s.id} ${statusBadge(s.status,s.score).replace(/badge /,'badge')}</strong> 得分：${s.score}</div>
            ${s.verdict_detail?`<pre style="margin-top:6px;white-space:pre-wrap;">${esc(s.verdict_detail)}</pre>`:''}
            ${renderSubtasks(s.subtask_scores||[], s.case_results||[])}
            ${renderCaseGrid(s.case_results||[])}
          </div>`;
      }
    });
    loadSubs();
  }catch(e){
    document.getElementById('result').innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`;
  }finally{
    btn.disabled=false; btn.textContent='提交评测';
  }
}

async function loadSubs(){
  if(!me) return;
  const r=await API.get(`/api/submissions?problem_id=${pid}&user_id=${me.id}&limit=20`);
  document.querySelector('#subs tbody').innerHTML=r.submissions.map(s=>
    `<tr><td class="mono"><a href="/submission/${s.id}">#${s.id}</a></td>
     <td>${statusBadge(s.status,s.score)}</td>
     <td class="mono">${s.score}</td>
     <td class="muted mono" style="font-size:12px;">${fmtTime(s.created_at)}</td></tr>`).join('');
}

(async()=>{
  me=await loadMe(); renderLayout(me,'problems');
  let r;
  try{
    r=await API.get(`/api/problem/${pid}`+(contestId?`?contest_id=${contestId}`:''));
  }catch(e){
    document.getElementById('grid').innerHTML=
      `<div class="card"><div class="card-body"><div class="alert alert-error">${esc(e.message)}</div></div></div>`;
    document.getElementById('ptitle').textContent='无法查看';
    return;
  }
  problem=r.problem;
  document.getElementById('ptitle').textContent=problem.title;
  if(contestId){
    const bc=document.getElementById('back-contest');
    bc.href=`/contest/${contestId}`;
    bc.style.display='inline-block';
  }
  document.getElementById('title').textContent=`${problem.title} (#${problem.id})`;
  const typeMap={personal:'个人题',thinking:'思维题',mystery:'神秘题',standard:'普通题'};
  const diff = difficultyBadge(problem.difficulty, problem.difficulty_hidden);
  const sec=(t,body)=> body&&body.trim() ? `<h2>${t}</h2>${renderStatement(body)}` : '';
  const hackSec = (problem.hack_data&&problem.hack_data.length) ? `
      <h2>Hack 记录</h2>
      <details>
        <summary style="cursor:pointer">成功 Hack 共 ${problem.hack_data.length} 条（展开列表，完整数据请打开独立页面）</summary>
        <ul style="margin:10px 0 0 18px;line-height:1.8">
          ${problem.hack_data.map(h=>{
            const sz=h.input_size||0;
            const lab=sz>=1048576?(sz/1048576).toFixed(2)+' MB':sz>=1024?(sz/1024).toFixed(1)+' KB':sz+' B';
            return `<li><a href="/hack/${h.id}">H${h.id}</a>
              ${hackBadge(h.status)}
              <span class="muted">${esc(h.attacker||'')} → ${esc(h.target||'')} · ${lab}</span>
              ${h.message?`<span class="muted"> · ${esc(h.message)}</span>`:''}</li>`;
          }).join('')}
        </ul>
      </details>` : '';
  const fioIn=(problem.file_io_in||'').trim(), fioOut=(problem.file_io_out||'').trim();
  const fioBanner=(fioIn||fioOut)?`<div class="file-io-banner">
      <strong>文件 IO</strong>
      ${fioIn?`<span>输入文件：<code>${esc(fioIn)}</code></span>`:''}
      ${fioOut?`<span>输出文件：<code>${esc(fioOut)}</code></span>`:''}
      <span class="muted">请用上述文件名读写，而不是标准输入输出</span>
    </div>`:'';
  document.getElementById('stmt').innerHTML=`
    <div class="problem-meta">
      <span><strong>类型：</strong>${typeMap[problem.problem_type]||'普通题'}</span>
      <span><strong>难度：</strong>${diff||'<span class="muted">未标注</span>'}</span>
      <span><strong>时限：</strong>${problem.time_limit} ms</span>
      <span><strong>内存：</strong>${problem.memory_limit} MB</span>
      <span><strong>满分：</strong>${problem.score_total}</span>
      ${problem.author?`<span><strong>出题人：</strong>${esc(problem.author)}</span>`:''}
      ${(fioIn||fioOut)?'<span class="checker-badge">文件 IO</span>':''}
      ${problem.functional?'<span class="checker-badge">函数式交互</span>':''}
    </div>
    ${problem.functional?`<div class="file-io-banner">
      <strong>函数式交互</strong>
      <span>请 <code>#include "interaction.h"</code> 实现接口函数（如 <code>solve()</code>）。
        <strong>不要写 main</strong>，输入由 grader 读取。</span>
      ${problem.interact_header?`<details style="margin-top:8px"><summary style="cursor:pointer">查看 interaction.h</summary>
        <pre class="code-body" style="margin-top:8px;white-space:pre-wrap">${esc(problem.interact_header)}</pre></details>`:''}
    </div>`:''}
    ${fioBanner}
    <div class="problem-body-inner">
      ${sec('题目背景',problem.background)}
      ${sec('题目描述',problem.description)}
      ${sec('输入格式',problem.input_format)}
      ${sec('输出格式',problem.output_format)}
      ${renderSampleGroups(problem.sample_groups, problem.samples)}
      ${sec('数据范围与约定',problem.constraints)}
      ${problem.use_subtasks==0 ? `
      <h2>测试点分值</h2>
      ${((problem.subtasks||[])[0]&&(problem.subtasks[0].testcases)||[]).map((c,i)=>
        `<p><strong>#${i+1}</strong> ${esc(c.input||'')}：${c.score||0} 分</p>`).join('')||'<p class="muted">未配置测试点分值</p>'}` :
      (problem.subtasks&&problem.subtasks.length?`
      <h2>子任务</h2>
      ${problem.subtasks.map((st,i)=>`<p><strong>子任务 ${i+1}</strong>（${st.score} 分）：${esc(st.name)}</p>`).join('')}`:'')}
      ${(problem.attachments||[]).length?`<h2>附件</h2><ul>${problem.attachments.map(a=>
        `<li><a href="/api/problem/${problem.id}/attach/${encodeURIComponent(a.name)}${contestId?`?contest_id=${contestId}`:''}">${esc(a.name)}</a>
          <span class="muted">${a.size}B</span></li>`).join('')}</ul>`:''}
      ${hackSec}
    </div>`;
  if(problem.functional){
    document.getElementById('code').placeholder='// 不要写 main。#include "interaction.h" 并实现 solve() ...';
  }
  loadSubs();
})();
</script>
</body>
</html>
