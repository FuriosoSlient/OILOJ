<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>比赛列表 - OIL OJ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar"><div class="title">比赛</div>
      <div style="flex:1"></div>
      <a href="/admin" class="btn btn-sm btn-primary" id="admin-btn" style="display:none">⚙️ 管理后台</a>
    </div>
    <div class="content"><div id="list">加载中...</div></div>
  </main>
</div>
<script src="/static/app.js"></script>
<script>
let me=null;

function card(c){
  const chip=`<span class="phase-chip phase-${c.phase}">${phaseLabel(c.phase)}</span>`;
  let timing='';
  if(c.phase==='before'){
    timing=`<span class="muted">距开始 <strong class="mono">${fmtClock(c.remaining)}</strong></span>`;
  }else if(c.phase==='solve'||c.phase==='hack'){
    timing=`<span class="muted"><span class="live-dot"></span>剩余 <strong class="mono">${fmtClock(c.remaining)}</strong></span>`;
  }else{
    timing='<span class="muted">已结束 · 题目与 Hack 数据已公开</span>';
  }
  return `<div class="contest-card">
    <div class="flex-between">
      <div>
        <a class="contest-title" href="/contest/${c.id}">${esc(c.label||('比赛 #'+c.id))} · ${esc(c.name)}</a>
        ${!c.is_published?' <span class="badge badge-PENDING">草稿</span>':''}
        <div class="muted" style="font-size:12px;margin-top:4px">
          ${(c.mode||'oil').toUpperCase()}${c.is_rated?' · Rated':' · Unrated'} ·
          开始：${fmtTime(c.start_time)} ·
          ${Math.round(c.solve_duration/60)} 分钟${(c.mode||'oil')==='oil'?' + Hack '+Math.round(c.hack_duration/60)+' 分钟':''} ·
          ${c.problem_count} 道题
          ${(c.mode==='ioi'||c.mode==='icpc')?` · 已报名 ${c.registered_count||0} 人${c.registered?'（你已报名）':''}`:''}
        </div>
        ${c.description?`<div class="muted" style="font-size:13px;margin-top:6px">${esc(c.description)}</div>`:''}
      </div>
      <div style="text-align:right">
        <div>${chip}</div>
        <div style="margin-top:8px">${timing}</div>
        <div style="margin-top:10px">
          <a href="/contest/${c.id}" class="btn btn-sm btn-primary">进入</a>
          <a href="/contest/${c.id}/standings" class="btn btn-sm btn-default">榜单</a>
        </div>
      </div>
    </div>
  </div>`;
}

async function load(){
  const r=await API.get('/api/contests');
  const cs=r.contests;
  if(!cs.length){
    document.getElementById('list').innerHTML=
      `<div class="card"><div class="card-body muted">暂无比赛。${me&&me.is_admin?'<a href="/admin">前往管理后台创建</a>':''}</div></div>`;
    return;
  }
  const running=cs.filter(c=>c.phase==='solve'||c.phase==='hack');
  const upcoming=cs.filter(c=>c.phase==='before');
  const past=cs.filter(c=>c.phase==='after');
  const sec=(t,arr)=>arr.length?`<h3 style="margin:14px 0 10px;font-size:15px;color:#5a6d80">${t}</h3>${arr.map(card).join('')}`:'';
  document.getElementById('list').innerHTML=
    sec('进行中',running)+sec('即将开始',upcoming)+sec('已结束',past);
}

setInterval(load, 10000);
(async()=>{
  me=await loadMe(); renderLayout(me,'contests');
  if(me&&(me.is_admin||me.is_manager)) document.getElementById('admin-btn').style.display='inline-block';
  load();
})();
</script>
</body>
</html>
