<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OIL 比赛 - OIL OJ</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div class="title" id="ctitle">OIL 比赛</div>
      <div style="flex:1"></div>
      <select id="contest-switch" onchange="if(this.value)location.href='/contest/'+this.value"
              style="margin-right:8px;padding:5px 8px;border:1px solid #d6dee6;border-radius:4px;font-size:13px"></select>
      <a href="/contests" class="btn btn-sm btn-default" style="margin-right:8px">全部比赛</a>
      <a href="#" id="standings-link" class="btn btn-sm btn-default" style="margin-right:8px">📊 实时榜单</a>
      <div id="admin-area"></div>
    </div>
    <div class="content" id="app">
      <div class="loading">加载中...</div>
    </div>
  </main>
</div>
<script src="/static/vendor/marked/marked.min.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/vendor/katex/auto-render.min.js"></script>
<script src="/static/vendor/dompurify/purify.min.js"></script>
<script src="/static/app.js"></script>
<script>
const cid=parseInt(location.pathname.split('/')[2]);
document.getElementById('standings-link').href=`/contest/${cid}/standings`;

// Populate the contest switcher so users can hop between contests directly.
(async()=>{
  try{
    const r=await API.get('/api/contests');
    const sel=document.getElementById('contest-switch');
    sel.innerHTML=r.contests.map(c=>
      `<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.label||('比赛 #'+c.id))} · ${esc(c.name)}</option>`).join('');
  }catch(e){}
})();
let me=null, contest=null, state=null, evt=null;
let currentTab='board';
let chatChannel=null;          // which team's channel a supervisor is viewing

// The whole page re-renders on every SSE tick. Without this, anything the user
// had typed (chat draft, hack input, checked subtasks) would be wiped mid-typing.
const DRAFTS = {};
function captureDrafts(){
  document.querySelectorAll('[data-keep]').forEach(el=>{
    if(el.type === 'checkbox' || el.type === 'radio') DRAFTS[el.dataset.keep] = el.checked;
    else DRAFTS[el.dataset.keep] = el.value;
  });
}
function restoreDrafts(){
  document.querySelectorAll('[data-keep]').forEach(el=>{
    const v = DRAFTS[el.dataset.keep];
    if(v === undefined) return;
    if(el.type === 'checkbox' || el.type === 'radio') el.checked = v;
    else el.value = v;
  });
}
function keepTarget(el){
  return el && el.dataset && el.dataset.keep;
}
function focusedKeep(){
  return keepTarget(document.activeElement) ? document.activeElement : null;
}
// Persist drafts as the user types so an SSE redraw cannot lose uncommitted IME text.
document.getElementById('app').addEventListener('input', e=>{
  const el = e.target;
  if(!keepTarget(el)) return;
  if(el.type === 'checkbox' || el.type === 'radio') DRAFTS[el.dataset.keep] = el.checked;
  else DRAFTS[el.dataset.keep] = el.value;
});
document.getElementById('app').addEventListener('change', e=>{
  const el = e.target;
  if(!keepTarget(el)) return;
  if(el.type === 'checkbox' || el.type === 'radio') DRAFTS[el.dataset.keep] = el.checked;
  else DRAFTS[el.dataset.keep] = el.value;
});

function stateFingerprint(s){
  if(!s) return '';
  const {remaining, now, ...rest} = s;
  return JSON.stringify(rest);
}
let lastFp = '';
const HACK_REPORTS = {};
function restoreHackReports(){
  Object.keys(HACK_REPORTS).forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML=HACK_REPORTS[id];
  });
}
function updateClockOnly(s){
  const el = document.querySelector('.phase-time');
  if(el) el.textContent = s.phase==='after'?'已结束':fmtClock(s.remaining);
}
// Remember scroll position of the message list too.
let chatAtBottom = true;
function captureChatScroll(){
  const el = document.getElementById('chat-msgs');
  if(el) chatAtBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 40;
}

const TYPE_NAME={personal:'个人题',thinking:'思维题',mystery:'神秘题'};

async function load(){
  contest=await API.get(`/api/contest/${cid}`);
  state=contest.state;
  render();
}

function connectSSE(){
  if(evt) evt.close();
  evt=new EventSource(`/api/contest/${cid}/stream`);
  evt.onmessage=e=>{ state=JSON.parse(e.data); render(false); };
  evt.onerror=()=>{ evt.close(); setTimeout(connectSSE,5000); };
}

function render(force){
  const s=state;
  if(!s) return;
  const fp = stateFingerprint(s);
  const typing = focusedKeep();
  // SSE ticks every 3s. Never tear down the Hack/chat form while the user is
  // composing — that was swallowing keystrokes (especially IME).
  if(!force && typing){
    updateClockOnly(s);
    captureDrafts();
    return;
  }
  if(!force && fp === lastFp && document.getElementById('app').querySelector('.phase-bar')){
    updateClockOnly(s);
    return;
  }
  lastFp = fp;

  const activeKeep = typing && typing.dataset.keep;
  const selStart = typing ? typing.selectionStart : null;
  const selEnd = typing ? typing.selectionEnd : null;

  captureDrafts();
  captureChatScroll();
  const isMember = me && me.team_id;
  const myTeam = isMember ? membersByTeam()[me.team_id] : null;

  // Phase bar
  let phaseDesc='';
  if(s.phase==='before') phaseDesc='比赛尚未开始';
  else if(s.phase==='solve') phaseDesc='做题阶段：完成个人题，锁题后可与队友协作并 Hack 对方同位置个人题';
  else if(s.phase==='hack') phaseDesc='公开 Hack 阶段：可 Hack 团队思维题；尚未锁题的选手仍可锁题以解锁团队题与 Hack';
  else phaseDesc='比赛已结束';

  let html=`
    <div class="phase-bar">
      <div style="flex:1">
        <div class="phase-label">${phaseLabel(s.phase)}</div>
        <div class="phase-desc">${phaseDesc}</div>
      </div>
      <div style="text-align:right">
        <div class="phase-time">${s.phase==='after'?'已结束':fmtClock(s.remaining)}</div>
        <div class="phase-desc">${s.viewer_locked?'🔒 你已锁题':(isMember?'未锁题':'')}</div>
        ${s.can_lock?`<div class="mt10"><button class="btn btn-warning" onclick="doLock()">🔒 锁定个人题</button></div>`:''}
      </div>
    </div>`;

  if(!isMember){
    html+=`<div class="alert alert-warn">你尚未被分配队伍，当前为旁观模式。请联系管理员将你加入参赛队伍。</div>`;
  }

  // Tabs
  html+=`<div class="tabs">
    <div class="tab ${currentTab==='board'?'active':''}" onclick="setTab('board')">📊 记分板</div>
    <div class="tab ${currentTab==='problems'?'active':''}" onclick="setTab('problems')">📝 题目</div>
    ${(s.viewer_locked && (s.phase==='solve'||s.phase==='hack')) || s.is_supervisor
        ? `<div class="tab ${currentTab==='chat'?'active':''}" onclick="setTab('chat')">💬 ${s.is_supervisor?'聊天监控':'队伍讨论'}</div>`:''}
    ${s.hack_targets.length>0 || s.team_hack_targets.length>0 ? `<div class="tab ${currentTab==='hack'?'active':''}" onclick="setTab('hack')">⚔️ Hack 中心</div>`:''}
  </div>`;

  if(currentTab==='board') html+=renderBoard(s);
  else if(currentTab==='problems') html+=renderProblems(s);
  else if(currentTab==='chat') html+=renderChat(s);
  else if(currentTab==='hack') html+=renderHack(s);

  document.getElementById('app').innerHTML=html;
  restoreDrafts();
  restoreHackReports();
  if(activeKeep){
    const el = document.querySelector('[data-keep="'+activeKeep.replace(/"/g,'')+'"]');
    if(el){
      el.focus();
      try{
        if(typeof selStart === 'number' && typeof el.setSelectionRange === 'function')
          el.setSelectionRange(selStart, selEnd);
      }catch(e){}
    }
  }
  if(currentTab==='chat' && chatAtBottom) scrollChat();
}

function membersByTeam(){
  const teams={};
  state.members.forEach(m=>{ (teams[m.team_id]=teams[m.team_id]||[]).push(m); });
  return teams;
}

function teamName(tid){ const m=state.members.find(x=>x.team_id===tid); return m?m.team_name:`Team ${tid}`; }
function teamColor(tid){ const m=state.members.find(x=>x.team_id===tid); return m?m.team_color:'#888'; }

function renderBoard(s){
  const teams=membersByTeam();
  const tids=Object.keys(teams);
  let html=`<div class="scoreboard-grid">`;
  tids.forEach(tid=>{
    const members=teams[tid];
    const total=s.team_totals[tid]||0;
    html+=`<div class="team-panel">
      <div class="team-header" style="background:${teamColor(tid)}">
        <span>${esc(teamName(tid))}</span>
        <span class="team-total">${total}</span>
      </div>`;
    members.sort((a,b)=>a.position-b.position).forEach(m=>{
      const ps=s.personal_scores[String(m.id)]||{total:0};
      const hacked = m.attacker_gain>0;
      html+=`<div class="team-member ${m.locked?'locked':''}">
        <span class="pos-tag">${m.position+1}</span>
        <span class="lock-icon">${m.locked?'🔒':'🔓'}</span>
        <span class="member-name">${esc(m.display_name)}</span>
        ${m.attacker_gain>0?`<span class="badge badge-SUCCESS">+${m.attacker_gain} 窃取</span>`:''}
        <span class="member-score">${ps.total}</span>
      </div>`;
    });
    // team problem scores
    html+=`<div style="padding:10px 18px;background:#fafbfc;border-top:1px solid #f0f0f0;">
      <div style="font-size:12px;color:#888;margin-bottom:6px;">团队题得分</div>`;
    state.all_problems_summary.filter(p=>p.type!=='personal').forEach(p=>{
      const sc=s.team_problem_score[`${tid}:${p.id}`]||0;
      html+=`<div class="flex-between" style="font-size:13px;padding:3px 0;">
        <span>${esc(p.title||'???')} <span style="color:#aaa;">(${p.type==='mystery'?'神秘':'思维'})</span></span>
        <strong class="${sc===p.score_total?'subtask-ok':(sc>0?'subtask-hacked':'muted')}">${sc}/${p.score_total}</strong></div>`;
    });
    html+=`</div></div>`;
  });
  html+=`</div>`;

  // Hack log
  if(s.hacks.length){
    html+=`<div class="card mt20"><div class="card-header">Hack 记录</div>
      <table><thead><tr><th>#</th><th>类型</th><th>攻击者</th><th>目标</th><th>题目</th><th>子任务</th><th>结果</th><th>时间</th></tr></thead><tbody>`;
    s.hacks.slice(0,50).forEach(h=>{
      const atk=state.members.find(m=>m.id===h.attacker_id);
      const tgt=state.members.find(m=>m.id===h.target_id);
      const prob=state.all_problems_summary.find(p=>p.id===h.problem_id);
      html+=`<tr>
        <td class="mono"><a href="/hack/${h.id}">H${h.id}</a></td>
        <td>${h.kind==='personal'?'个人题':'团队题'}</td>
        <td>${atk?esc(atk.display_name):'?'}</td>
        <td>${tgt?esc(tgt.display_name):'?'}</td>
        <td>${prob?esc(prob.title):'?'}</td>
        <td>${h.kind==='personal'?h.subtask_indices.map(i=>'子任务'+(i+1)).join(','):'—'}</td>
        <td>${hackBadge(h.status)}</td>
        <td class="muted mono" style="font-size:12px;">${fmtTime(h.created_at)}</td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  }
  return html;
}

function renderProblems(s){
  const myPos=me?me.position:null;
  let html='<div class="problem-grid">';
  s.problems.forEach(p=>{
    if(p.type==='personal'){
      const mine = p.is_own;
      const lockedOut = p.is_own && s.viewer_locked;
      const canSee = p.visible;
      html+=`<div class="problem-tile ${!canSee?'locked-hidden':''}">
        <div class="pt-title">
          <span class="pt-type type-personal">个人题 位置${(p.position||0)+1}${p.which!=null?' · '+(p.which===0?'A':'B'):''}</span>
          ${p.file_io?'<span class="checker-badge">文件 IO</span>':''}
          ${mine?'<span class="badge badge-SUCCESS" style="margin-left:6px;">我的题</span>':''}
          ${lockedOut?'<span class="badge badge-INVALID" style="margin-left:6px;">已锁定</span>':''}
        </div>
        <div style="margin:8px 0;font-weight:600;font-size:15px;">${canSee?esc(p.title||'???'):'??? 未解锁'}</div>
        <div class="pt-meta">
          <span>${p.score_total} 分</span>
          ${canSee?`<a href="/problem/${p.id}?contest_id=${cid}">查看/提交 →</a>`:'<span class="muted">锁题后可见对方个人题</span>'}
        </div>
        ${mine && s.can_lock?`
          <div class="mt10">
            <button class="btn btn-warning btn-sm" onclick="doLock()" style="width:100%;">🔒 锁定个人题</button>
          </div>`:''}
        ${renderPersonalScore(p,s)}
      </div>`;
    } else {
      const canSee=p.visible;
      const cls=p.type==='mystery'?'type-mystery':'type-thinking';
      html+=`<div class="problem-tile ${!canSee?'locked-hidden':''}">
        <div class="pt-title">
          <span class="pt-type ${cls}">${p.type==='mystery'?'神秘题':'思维题'}</span>
          ${p.file_io?'<span class="checker-badge">文件 IO</span>':''}
        </div>
        <div style="margin:8px 0;font-weight:600;font-size:15px;">${canSee?esc(p.title):'🔒 锁题后解锁'}</div>
        <div class="pt-meta">
          <span>${p.score_total} 分${p.type==='thinking'?' · 无部分分':''}${p.type==='mystery'?' · 禁止 Hack':''}</span>
          ${canSee?`<a href="/problem/${p.id}?contest_id=${cid}">查看/提交 →</a>`:''}
        </div>
        ${canSee?renderTeamScore(p,s):''}
      </div>`;
    }
  });
  html+='</div>';

  if(s.viewer_locked && (s.phase==='solve'||s.phase==='hack')){
    html+=`<div class="alert alert-info mt20">你已锁定个人题。现在可以与已锁题的队友在"队伍讨论"中交流，也可以使用 Hack 中心。个人题无法再修改提交。</div>`;
  }
  if(s.can_lock){
    html+=`<div class="alert alert-warn mt20">⚠️ 锁定个人题后将<strong>无法再修改</strong>个人题提交，但可以解锁团队题、参与队伍讨论、并 Hack。做题阶段与公开 Hack 阶段均可锁题。
      <div class="mt10"><button class="btn btn-warning" onclick="doLock()">🔒 立即锁定个人题</button></div></div>`;
  }
  return html;
}

function renderPersonalScore(p,s){
  if(!p.is_own) return '';
  const ps=s.personal_scores[String(me.id)];
  const block = ps && ps.by_pid && ps.by_pid[String(p.id)];
  const raws = block ? block.raw : (ps && ps.raw);
  const effs = block ? block.eff : (ps && ps.eff);
  if(!ps || (!block && !ps.submitted)) return '<div class="mt10 muted" style="font-size:12px;">尚未提交</div>';
  if(!raws) return '<div class="mt10 muted" style="font-size:12px;">尚未提交</div>';
  let html='<div class="mt10" style="font-size:12px;">';
  (p.subtasks||[]).forEach((st,i)=>{
    const got=(effs&&effs[i])||0;
    const raw=(raws&&raws[i])||0;
    const hacked = got!==raw && raw>0;
    html+=`<div class="flex-between" style="padding:2px 0;">
      <span>子任务${i+1}</span>
      <strong class="${got?'subtask-ok':'muted'} ${hacked?'subtask-hacked':''}">
        ${got}/${st.score}${hacked?' (被Hack)':''}
      </strong></div>`;
  });
  html+=`</div>`;
  return html;
}

function renderTeamScore(p,s){
  if(!me) return '';
  const tid=me.team_id;
  const sc=s.team_problem_score[`${tid}:${p.id}`]||0;
  const oppTid=Object.keys(s.team_totals).find(t=>t!=tid);
  const oppSc=oppTid?(s.team_problem_score[`${oppTid}:${p.id}`]||0):0;
  return `<div class="mt10" style="font-size:12px;">
    <div class="flex-between"><span>我方得分</span><strong class="${sc?'subtask-ok':'muted'}">${sc}/${p.score_total}</strong></div>
    ${oppTid?`<div class="flex-between"><span>对方得分</span><strong class="muted">${oppSc}/${p.score_total}</strong></div>`:''}
  </div>`;
}

function chatMsgList(msgs, emptyHint){
  if(!msgs || !msgs.length)
    return `<div class="muted text-center" style="padding:40px;">${esc(emptyHint)}</div>`;
  return msgs.map(m=>`
    <div class="chat-msg">
      <span class="cm-author">${esc(m.uname)}</span>
      <span class="cm-time">${fmtTime(m.created_at)}</span>
      <div class="cm-text">${esc(m.message)}</div>
    </div>`).join('');
}

function renderChat(s){
  // --- supervisor view: read-only access to BOTH teams' channels ---
  if(s.is_supervisor){
    const chans = s.all_channels || [];
    if(!chans.length) return '<div class="alert alert-warn">暂无队伍。</div>';
    if(chatChannel === null || !chans.some(c=>c.team_id===chatChannel))
      chatChannel = chans[0].team_id;
    const cur = chans.find(c=>c.team_id===chatChannel) || chans[0];
    return `<div class="card">
      <div class="card-header">💬 聊天监控（管理员 / 出题负责人）</div>
      <div class="card-body" style="padding-bottom:0">
        <div class="flex gap8" style="flex-wrap:wrap">
          ${chans.map(c=>`
            <button class="btn btn-sm ${c.team_id===chatChannel?'btn-primary':'btn-default'}"
                    onclick="chatChannel=${c.team_id};render()">
              <span style="display:inline-block;width:9px;height:9px;border-radius:50%;
                background:${esc(c.team_color||'#888')};margin-right:5px"></span>
              ${esc(c.team_name||('队伍 '+c.team_id))}
              <span class="muted">(${(c.messages||[]).length})</span>
            </button>`).join('')}
        </div>
      </div>
      <div class="chat-box">
        <div class="chat-messages" id="chat-msgs">
          ${chatMsgList(cur.messages, '该队伍还没有消息。')}
        </div>
      </div>
    </div>
    <div class="alert alert-info">你以监督身份查看双方讨论，只读、不参与发言。</div>`;
  }

  if(!s.can_chat) return '<div class="alert alert-warn">仅已锁题成员在比赛期间可查看队伍讨论。</div>';
  return `<div class="card">
    <div class="card-header">💬 队伍讨论（仅本队已锁题成员可见）</div>
    <div class="chat-box">
      <div class="chat-messages" id="chat-msgs">
        ${chatMsgList(s.messages, '还没有消息，开始和队友讨论吧！')}
      </div>
      <div class="chat-input">
        <input type="text" id="chat-text" data-keep="chat-text"
               placeholder="输入消息，Enter 发送..." maxlength="1000"
               onkeydown="if(event.key==='Enter'){event.preventDefault();sendMsg();}">
        <button class="btn btn-primary" onclick="sendMsg()">发送</button>
      </div>
    </div>
  </div>
  <div class="alert alert-info">提示：未锁题的队友看不到这些讨论。比赛结束后所有队伍成员可查看聊天记录。</div>`;
}

function renderHack(s){
  let html='';
  if(s.hack_targets.length){
    html+='<div class="card"><div class="card-header">🎯 个人题 Hack（做题阶段）</div><div class="card-body">';
    html+='<div class="alert alert-info">选择对方同位置选手已得分的子任务，提供一组测试输入。若对方代码在该输入上出错，该子任务得分变为原来的 <strong>40%</strong>。你<strong>不会</strong>因此得分。</div>';
    s.hack_targets.forEach(t=>{
      const available=t.scored_subtasks.filter(x=>!x.hacked);
      if(!available.length){
        html+=`<div class="alert alert-success" style="margin:8px 0;">${esc(t.display_name)} 的 ${esc(t.problem_title)} 已无可 Hack 的子任务。</div>`;
        return;
      }
      html+=`<div style="border:1px solid var(--loj-border);border-radius:6px;padding:14px;margin:10px 0;">
        <div style="font-weight:600;margin-bottom:8px;">目标：${esc(t.display_name)} — ${esc(t.problem_title)}</div>
        <div class="subtask-hack-list">
          ${available.map(st=>`<label><input type="checkbox" class="hk-sub" data-idx="${st.index}" data-target="${t.user_id}" data-problem="${t.problem_id}" data-keep="hk-${t.user_id}-${t.problem_id}-${st.index}"> 子任务 ${st.index+1}（${esc(st.name)}，当前 ${st.score} 分）</label>`).join('')}
        </div>
        <div class="form-group mt10">
          <label>测试输入</label>
          <textarea class="mono" id="hack-input-${t.user_id}-${t.problem_id}" data-keep="hi-${t.user_id}-${t.problem_id}" rows="6" placeholder="输入会喂给对方的程序..."></textarea>
          ${hackFileBar('hack-input-'+t.user_id+'-'+t.problem_id)}
        </div>
        <button class="btn btn-danger btn-sm" onclick="doPersonalHack(${t.user_id},${t.problem_id})">发起 Hack</button>
        <div id="hack-res-${t.user_id}-${t.problem_id}"></div>
      </div>`;
    });
    html+='</div></div>';
  }
  if(s.team_hack_targets.length){
    html+='<div class="card"><div class="card-header">⚔️ 团队题 Hack（公开 Hack 阶段）</div><div class="card-body">';
    html+='<div class="alert alert-info">提供一组测试输入。系统会用该输入测试对方所有正确做法；只有<strong>全部失败</strong>才算 Hack 成功。成功后对方该题分数变为 30%，你获得该题满分的 <strong>70%</strong>（窃取）。神秘题不可 Hack。</div>';
    s.team_hack_targets.forEach(t=>{
      if(t.hacked){
        html+=`<div class="alert alert-success" style="margin:8px 0;">${esc(t.problem_title)} 已被成功 Hack，对方仅保留 30% 分数。</div>`;
        return;
      }
      html+=`<div style="border:1px solid var(--loj-border);border-radius:6px;padding:14px;margin:10px 0;">
        <div style="font-weight:600;margin-bottom:4px;">${esc(t.problem_title)}（${t.score_total} 分）</div>
        <div style="font-size:12px;color:#888;margin-bottom:8px;">对方正确做法：
          ${(t.solver_subs||[]).map(c=>c.submission_id
              ? `<a href="/submission/${c.submission_id}" target="_blank">${esc(c.display_name)} #${c.submission_id}</a>`
              : esc(c.display_name)).join(' · ')
            || (t.solvers||[]).map(esc).join(', ')}</div>
        <div class="form-group">
          <label>测试输入</label>
          <textarea class="mono" id="thack-input-${t.problem_id}" data-keep="thi-${t.problem_id}" rows="6"></textarea>
          ${hackFileBar('thack-input-'+t.problem_id)}
        </div>
        <button class="btn btn-danger btn-sm" onclick="doTeamHack(${t.problem_id})">发起团队 Hack</button>
        <div id="thack-res-${t.problem_id}"></div>
      </div>`;
    });
    html+='</div></div>';
  }
  if(!html) html='<div class="alert alert-info">当前没有可 Hack 的目标。个人题 Hack 需在做题阶段且你已锁题；团队题 Hack 在公开 Hack 阶段开放。</div>';
  return html;
}

async function doLock(){
  if(!confirm('确定锁定个人题？锁定后无法再修改个人题提交，但可以解锁团队题、参与讨论并 Hack 对方。')) return;
  try{ await API.post(`/api/contest/${cid}/lock`,{}); toast('已锁定个人题','success'); load(); }
  catch(e){ toast(e.message,'error'); }
}

async function sendMsg(){
  const inp=document.getElementById('chat-text');
  const msg=inp.value.trim(); if(!msg) return;
  try{
    await API.post(`/api/contest/${cid}/message`,{message:msg});
    inp.value='';
    DRAFTS['chat-text']='';       // clear the preserved draft as well
    chatAtBottom=true;
    load();
  }catch(e){ toast(e.message,'error'); }
}

function scrollChat(){ const el=document.getElementById('chat-msgs'); if(el) el.scrollTop=el.scrollHeight; }

async function doPersonalHack(targetId,problemId){
  const boxes=document.querySelectorAll(`.hk-sub[data-target="${targetId}"][data-problem="${problemId}"]:checked`);
  const idxs=Array.from(boxes).map(b=>parseInt(b.dataset.idx));
  if(!idxs.length){toast('请选择至少一个子任务','error');return;}
  const taId=`hack-input-${targetId}-${problemId}`;
  const input=(document.getElementById(taId).value||'') + (HACK_FILES[taId]?' file':'');
  if(!(document.getElementById(taId).value||'').trim() && !HACK_FILES[taId]){toast('请输入或上传测试数据','error');return;}
  const res=document.getElementById(`hack-res-${targetId}-${problemId}`);
        res.innerHTML='<div class="alert alert-info"><span class="live-dot"></span>已提交，正在运行 校验器 → 标程 → 对方程序 ...</div>';
  try{
    const r=await postHackForm('/api/hack',{contest_id:cid,target_id:targetId,problem_id:problemId,kind:'personal',subtask_indices:JSON.stringify(idxs)}, taId);
    await followHack(r.hack_id, h=>{
      if(h.status==='PENDING'||h.status==='JUDGING')
        res.innerHTML='<div class="alert alert-info"><span class="live-dot"></span>判定中：校验器 → 标程 → 对方程序 ...</div>';
    });
    await showHackReport(r.hack_id, res);
    HACK_REPORTS[res.id] = res.innerHTML;
    lastFp = '';
    await load();
  }catch(e){
    res.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`;
    HACK_REPORTS[res.id] = res.innerHTML;
  }
}

async function doTeamHack(problemId){
  const taId=`thack-input-${problemId}`;
  if(!(document.getElementById(taId).value||'').trim() && !HACK_FILES[taId]){toast('请输入或上传测试数据','error');return;}
  // target = any member of opposing team
  const myTid=me.team_id;
  const opp=state.members.find(m=>m.team_id!==myTid);
  if(!opp){toast('未找到对方队伍','error');return;}
  const res=document.getElementById(`thack-res-${problemId}`);
  res.innerHTML='<div class="alert alert-info"><span class="live-dot"></span>已提交，需击破对方所有正确做法，正在判定 ...</div>';
  try{
    const r=await API.post('/api/hack',{contest_id:cid,target_id:opp.id,problem_id:problemId,kind:'team',subtask_indices:'[]',input_data:input});
    await followHack(r.hack_id, h=>{
      if(h.status==='PENDING'||h.status==='JUDGING')
        res.innerHTML='<div class="alert alert-info"><span class="live-dot"></span>判定中：标程 → 你的程序 → 对方每份正确做法×5 ...</div>';
    });
    await showHackReport(r.hack_id, res);
    await load();
  }catch(e){ res.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`; }
}

function setTab(t){ currentTab=t; render(true); }

(async()=>{
  me=await loadMe(); renderLayout(me,'contest');

})();

async function resetContest(){
  if(!confirm('确定重置比赛？将清空所有提交、Hack、聊天和锁题记录，并重新开始计时。')) return;
  try{ await API.post(`/api/admin/reset_contest/${cid}`,{}); toast('比赛已重置','success'); load(); }
  catch(e){toast(e.message,'error');}
}
